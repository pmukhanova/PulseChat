name: pulse-chat

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse_chat}
      POSTGRES_USER: ${POSTGRES_USER:-pulse_chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_chat_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse_chat} -d ${POSTGRES_DB:-pulse_chat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulse_chat}:${POSTGRES_PASSWORD:-pulse_chat_dev}@postgres:5432/${POSTGRES_DB:-pulse_chat}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to at least 32 random characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      BACKEND_PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    command: >-
      sh -c "node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js && node dist/main.js"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: build
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-pulse_chat}:${POSTGRES_PASSWORD:-pulse_chat_dev}@postgres:5432/pulse_chat_test
      JWT_SECRET: pulse-chat-e2e-only-secret-at-least-32-characters
    command: npm run test:e2e
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
