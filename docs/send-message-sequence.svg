<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Отправка сообщения через персональные Socket.IO rooms</title><desc id="desc">Gateway проверяет доступ, сохраняет сообщение в PostgreSQL и отправляет его всем участникам через персональные rooms; повтор с тем же clientMessageId не создаёт второй INSERT.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#43526d}.note{font-size:16px;fill:#173b77}.life{stroke:#a9b9d3;stroke-width:2;stroke-dasharray:8 7}.arrow{stroke:#547099;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.return{stroke:#547099;stroke-width:2.5;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.event{stroke:#0a5bde;stroke-width:2.8;fill:none;marker-end:url(#blue)}.band{fill:#f3f7ff;stroke:#b9cdf4;stroke-width:2}.alt{fill:#f8fbff;stroke:#b9cdf4;stroke-width:2}.retry{fill:#fff8ec;stroke:#f2b35d;stroke-width:2}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#547099"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#0a5bde"/></marker></defs>
  <rect width="1800" height="1080" fill="#f8fbff"/><text x="70" y="68" class="title">Отправка сообщения: запись до доставки</text>
  <g class="band"><rect x="80" y="105" width="150" height="62" rx="14"/><rect x="330" y="105" width="170" height="62" rx="14"/><rect x="600" y="105" width="170" height="62" rx="14"/><rect x="870" y="105" width="170" height="62" rx="14"/><rect x="1140" y="105" width="170" height="62" rx="14"/><rect x="1410" y="105" width="150" height="62" rx="14"/><rect x="1640" y="105" width="110" height="62" rx="14"/></g>
  <text x="113" y="143" class="label">Клиент A</text><text x="370" y="143" class="label">Gateway</text><text x="628" y="143" class="label">Chats</text><text x="892" y="143" class="label">Messages</text><text x="1185" y="143" class="label">PostgreSQL</text><text x="1437" y="143" class="label">Registry</text><text x="1655" y="143" class="label">Клиент B</text>
  <path d="M155 167 V930 M415 167 V930 M685 167 V930 M955 167 V930 M1225 167 V930 M1485 167 V930 M1695 167 V930" class="life"/>
  <path d="M155 225 H415" class="arrow"/><text x="185" y="213" class="small">send_message(chatId, content, clientMessageId)</text>
  <path d="M415 284 H685" class="arrow"/><text x="468" y="272" class="small">проверить membership</text><path d="M685 326 H415" class="return"/><text x="474" y="349" class="small">доступ подтверждён</text>
  <path d="M415 390 H955" class="arrow"/><text x="585" y="378" class="small">create(userId, payload)</text><path d="M955 440 H1225" class="arrow"/><text x="986" y="428" class="small">найти clientMessageId</text>
  <rect x="840" y="482" width="650" height="250" rx="16" class="alt"/><text x="864" y="515" class="label">Новое сообщение</text><path d="M955 558 H1225" class="arrow"/><text x="1010" y="546" class="small">INSERT, затем SELECT sender</text><path d="M1225 600 H955" class="return"/><text x="1038" y="624" class="small">сохранённое сообщение</text><path d="M955 664 H415" class="return"/><text x="603" y="652" class="small">message, deduplicated=false</text><path d="M415 704 H685" class="arrow"/><text x="471" y="692" class="small">получить участников</text><path d="M415 746 H1485" class="event"/><text x="742" y="733" class="small">emitMessageCreated → user:&lt;participantId&gt; rooms</text><path d="M1485 786 H1695" class="event"/><text x="1510" y="774" class="small">message_created</text><path d="M415 826 H155" class="return"/><text x="210" y="851" class="small">ack: ok=true, saved message</text>
  <rect x="840" y="875" width="650" height="125" rx="16" class="retry"/><text x="864" y="910" class="label">Повтор с тем же clientMessageId</text><text x="864" y="942" class="small">MessagesService возвращает существующую запись. Второй INSERT и второй broadcast не выполняются.</text><text x="864" y="970" class="small">Gateway возвращает ack с deduplicated=true.</text>
  <rect x="80" y="1018" width="1670" height="42" rx="12" fill="#eaf2ff"/><text x="106" y="1046" class="note">JWT пользователя проверяется при Socket.IO handshake. Получателю не требуется предварительно открыть чат или выполнить join_chat.</text>
</svg>
