<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Синхронизация PulseChat в реальном времени</title>
  <desc id="desc">Персональные rooms уведомляют пользователей о новых чатах, сообщениях и изменениях ролей без перезагрузки страницы.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:18px;fill:#42506a}.small{font-size:16px;fill:#50627e}.box{fill:#fff;stroke:#b9cdf4;stroke-width:2}.soft{fill:#f3f7ff;stroke:#84a9ef;stroke-width:2}.blue{fill:#0a5bde;stroke:#0a5bde}.white{fill:#fff}.arrow{stroke:#547099;stroke-width:3;fill:none;marker-end:url(#arrow)}.event{stroke:#0a5bde;stroke-width:3;fill:none;marker-end:url(#blueArrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#547099"/></marker><marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#0a5bde"/></marker></defs>
  <rect width="1600" height="900" fill="#f8fbff"/><text x="80" y="76" class="title">Синхронизация без reload</text><text x="80" y="111" class="body">Изменения не передают чужую модель Chat: клиент получает chatId и запрашивает свою актуальную модель через REST.</text>
  <rect x="88" y="190" width="330" height="545" rx="24" class="box"/><text x="120" y="238" class="label">Пользователь A</text><rect x="120" y="274" width="266" height="108" rx="16" class="soft"/><text x="144" y="317" class="label">Создаёт DIRECT / GROUP</text><text x="144" y="345" class="small">обычная REST-команда</text><rect x="120" y="532" width="266" height="112" rx="16" class="soft"/><text x="144" y="574" class="label">Отправляет сообщение</text><text x="144" y="603" class="small">после PostgreSQL INSERT</text>
  <rect x="597" y="190" width="406" height="545" rx="24" class="box"/><text x="630" y="238" class="label">Backend</text><rect x="630" y="274" width="340" height="126" rx="16" class="soft"/><text x="654" y="316" class="label">ChatsService</text><text x="654" y="344" class="small">chat_list_changed</text><text x="654" y="369" class="small">chat_details_changed</text><rect x="630" y="444" width="340" height="164" rx="16" class="blue"/><text x="654" y="488" class="label white">RealtimeRegistryService</text><text x="654" y="520" class="small white">user:&lt;userId&gt; rooms</text><text x="654" y="548" class="small white">message_created</text><text x="654" y="576" class="small white">chat_access_revoked</text>
  <rect x="1182" y="190" width="330" height="545" rx="24" class="box"/><text x="1214" y="238" class="label">Пользователь B</text><rect x="1214" y="274" width="266" height="130" rx="16" class="soft"/><text x="1238" y="316" class="label">Новый чат в sidebar</text><text x="1238" y="344" class="small">тихий GET /chats</text><text x="1238" y="369" class="small">без переключения чата</text><rect x="1214" y="454" width="266" height="190" rx="16" class="soft"/><text x="1238" y="494" class="label">Неактивный чат</text><text x="1238" y="523" class="small">preview и порядок обновлены</text><text x="1238" y="550" class="small">чужое сообщение: unread +1</text><text x="1238" y="577" class="small">открытие чата: unread = 0</text><text x="1238" y="608" class="small">роль: GET /chats/:id</text>
  <path d="M420 330 H628" class="arrow"/><path d="M970 336 H1212" class="event"/><text x="1022" y="318" class="small">chat_list_changed</text>
  <path d="M420 585 H628" class="arrow"/><path d="M970 524 H1212" class="event"/><text x="1022" y="506" class="small">message_created</text>
  <path d="M420 365 C520 470 530 610 628 612" class="arrow"/><path d="M970 580 H1212" class="event"/><text x="1008" y="621" class="small">chat_details_changed</text>
  <rect x="88" y="784" width="1424" height="78" rx="18" fill="#eaf2ff" stroke="#b9cdf4" stroke-width="2"/><text x="120" y="830" class="body">Результат: новый чат, сообщение в неактивном чате и новая роль видны без перезагрузки. Unread хранится только локально в React.</text>
</svg>
