<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура PulseChat</title>
  <desc id="desc">React-клиент через Nginx взаимодействует с NestJS по REST и Socket.IO; PostgreSQL хранит данные, персональные rooms доставляют события пользователям.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:18px;fill:#42506a}.small{font-size:16px;fill:#50627e}.box{fill:#fff;stroke:#b9cdf4;stroke-width:2}.soft{fill:#f3f7ff;stroke:#84a9ef;stroke-width:2}.blue{fill:#0a5bde;stroke:#0a5bde}.white{fill:#fff}.arrow{stroke:#547099;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#547099;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#547099"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f8fbff"/>
  <text x="80" y="76" class="title">Архитектура PulseChat</text>
  <text x="80" y="111" class="body">Один NestJS backend, PostgreSQL как источник истины и персональные Socket.IO rooms для синхронизации интерфейса.</text>

  <rect x="80" y="190" width="300" height="445" rx="24" class="box"/>
  <text x="112" y="242" class="label">Браузер</text>
  <rect x="112" y="277" width="236" height="86" rx="16" class="soft"/>
  <text x="136" y="315" class="label">React + TypeScript</text><text x="136" y="342" class="small">интерфейс чатов</text>
  <rect x="112" y="390" width="236" height="76" rx="16" class="soft"/>
  <text x="136" y="425" class="label">Axios / REST</text><text x="136" y="450" class="small">Bearer JWT</text>
  <rect x="112" y="493" width="236" height="104" rx="16" class="soft"/>
  <text x="136" y="531" class="label">socket.io-client</text><text x="136" y="556" class="small">user:&lt;userId&gt; rooms</text><text x="136" y="578" class="small">локальный unread</text>

  <rect x="492" y="338" width="190" height="140" rx="22" class="blue"/>
  <text x="548" y="397" class="label white">Nginx</text><text x="525" y="430" class="small white">static + proxy</text>

  <rect x="794" y="190" width="510" height="445" rx="24" class="box"/>
  <text x="828" y="242" class="label">NestJS: модульный монолит</text>
  <rect x="828" y="277" width="205" height="102" rx="16" class="soft"/>
  <text x="855" y="318" class="label">REST API</text><text x="855" y="345" class="small">auth · chats · messages</text>
  <rect x="1063" y="277" width="207" height="102" rx="16" class="soft"/>
  <text x="1083" y="318" class="label">Socket.IO</text><text x="1083" y="345" class="small">JWT handshake · ack</text>
  <rect x="828" y="420" width="205" height="139" rx="16" class="soft"/>
  <text x="855" y="458" class="label">Сервисы</text><text x="855" y="486" class="small">Auth · Chats</text><text x="855" y="509" class="small">Messages · Audit</text>
  <rect x="1063" y="420" width="207" height="139" rx="16" class="soft"/>
  <text x="1083" y="458" class="label">RealtimeRegistry</text><text x="1083" y="486" class="small">message_created</text><text x="1083" y="509" class="small">list/details changed</text>

  <rect x="1375" y="329" width="165" height="160" rx="22" class="blue"/>
  <text x="1400" y="383" class="label white">PostgreSQL</text><text x="1396" y="414" class="small white">5 таблиц</text><text x="1396" y="439" class="small white">транзакции</text>

  <path d="M380 405 H490" class="arrow"/><text x="397" y="387" class="small">REST / API</text>
  <path d="M380 530 H490" class="arrow"/><text x="397" y="557" class="small">Socket.IO</text>
  <path d="M682 383 H826" class="arrow"/><path d="M682 437 H1061" class="arrow"/>
  <path d="M1032 488 H1061" class="arrow"/>
  <path d="M1270 488 H1373" class="arrow"/>
  <path d="M1270 326 C1360 190 1320 125 985 125 C610 125 560 175 330 270" class="dash"/>
  <text x="995" y="146" class="small">персональные события пользователям</text>
  <rect x="80" y="710" width="1460" height="105" rx="18" fill="#eaf2ff" stroke="#b9cdf4" stroke-width="2"/>
  <text x="114" y="753" class="label">Разделение ответственности</text>
  <text x="114" y="787" class="body">REST создаёт и читает данные. Socket.IO доставляет новые сообщения и invalidation-события. Брокер, Redis и микросервисы в текущей версии не используются.</text>
</svg>
