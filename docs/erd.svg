<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">ER-диаграмма базы данных PulseChat</title><desc id="desc">Пять таблиц PulseChat с ключами, связями, ограничениями и индексами.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.head{font-size:21px;font-weight:700;fill:#fff}.bluehead{font-size:21px;font-weight:700;fill:#0a5bde}.field{font-size:16px}.key{font-size:15px;fill:#40506a}.rel{stroke:#5a749c;stroke-width:3;fill:none}.tag{font-size:16px;fill:#42506a}.card{fill:#fff;stroke:#8dadeb;stroke-width:2}.top{fill:#0a5bde}.constraint{fill:#f3f7ff;stroke:#b9cdf4;stroke-width:2}.note{font-size:16px;fill:#173b77}</style></defs>
  <rect width="1600" height="1080" fill="#f8fbff"/><text x="70" y="68" class="title">ER-диаграмма PulseChat</text><text x="70" y="102" class="tag">Реляционная модель: роли принадлежат членству, а идемпотентность защищается уникальной парой sender_id + client_message_id.</text>
  <path d="M365 350 C500 350 485 330 610 330" class="rel"/><text x="455" y="326" class="tag">1 : N</text><path d="M365 385 C505 500 500 660 610 690" class="rel"/><text x="467" y="545" class="tag">1 : N</text><path d="M840 410 V580" class="rel"/><text x="857" y="500" class="tag">1 : N</text><path d="M1070 410 C1150 460 1160 650 1215 690" class="rel"/><text x="1120" y="548" class="tag">1 : N</text><path d="M840 410 C920 510 940 690 1215 720" class="rel"/><text x="981" y="600" class="tag">1 : N</text><path d="M365 420 C450 690 430 850 610 890" class="rel"/><text x="430" y="730" class="tag">0..1 : N</text>
  <g><rect x="80" y="210" width="285" height="230" rx="16" class="card"/><path d="M96 210 H349 Q365 210 365 226 V267 H80 V226 Q80 210 96 210" class="top"/><text x="105" y="246" class="head">USERS</text><text x="104" y="298" class="field">id · uuid · PK</text><text x="104" y="328" class="field">username · varchar(32) · UQ</text><text x="104" y="358" class="field">password_hash · varchar(100)</text><text x="104" y="388" class="field">created_at · updated_at</text></g>
  <g><rect x="610" y="210" width="300" height="200" rx="16" class="card"/><path d="M626 210 H894 Q910 210 910 226 V267 H610 V226 Q610 210 626 210" class="top"/><text x="635" y="246" class="head">CHATS</text><text x="634" y="298" class="field">id · uuid · PK</text><text x="634" y="328" class="field">type · chat_type_enum</text><text x="634" y="358" class="field">title · varchar(100), NULL для DIRECT</text><text x="634" y="388" class="field">created_by · uuid · FK</text></g>
  <g><rect x="1215" y="210" width="300" height="200" rx="16" class="card"/><path d="M1231 210 H1499 Q1515 210 1515 226 V267 H1215 V226 Q1215 210 1231 210" class="top"/><text x="1240" y="246" class="head">AUDIT_LOGS</text><text x="1239" y="298" class="field">id · uuid · PK</text><text x="1239" y="328" class="field">user_id · uuid · FK, nullable</text><text x="1239" y="358" class="field">action · entity_type · entity_id</text><text x="1239" y="388" class="field">metadata · jsonb · created_at</text></g>
  <g><rect x="610" y="580" width="300" height="210" rx="16" class="card"/><path d="M626 580 H894 Q910 580 910 596 V637 H610 V596 Q610 580 626 580" class="top"/><text x="635" y="616" class="head">CHAT_MEMBERS</text><text x="634" y="668" class="field">chat_id · uuid · PK, FK</text><text x="634" y="698" class="field">user_id · uuid · PK, FK</text><text x="634" y="728" class="field">role · chat_member_role_enum</text><text x="634" y="758" class="field">joined_at · timestamptz</text></g>
  <g><rect x="1215" y="580" width="300" height="210" rx="16" class="card"/><path d="M1231 580 H1499 Q1515 580 1515 596 V637 H1215 V596 Q1215 580 1231 580" class="top"/><text x="1240" y="616" class="head">MESSAGES</text><text x="1239" y="668" class="field">id · uuid · PK</text><text x="1239" y="698" class="field">chat_id · sender_id · FK</text><text x="1239" y="728" class="field">content · text</text><text x="1239" y="758" class="field">client_message_id · uuid · created_at</text></g>
  <rect x="80" y="850" width="1435" height="160" rx="18" class="constraint"/><text x="112" y="892" class="bluehead">Ключевые ограничения и индексы</text><text x="112" y="930" class="note">PK chat_members(chat_id, user_id) · UNIQUE users(username) · UNIQUE messages(sender_id, client_message_id)</text><text x="112" y="964" class="note">INDEX chat_members(user_id, chat_id) · INDEX messages(chat_id, created_at DESC, id DESC) · INDEX audit_logs(created_at DESC)</text><text x="112" y="994" class="note">Связь USERS ↔ CHATS разрешается через CHAT_MEMBERS; в этой же таблице хранится OWNER, ADMIN или MEMBER.</text>
</svg>
